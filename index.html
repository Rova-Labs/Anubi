<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>بوابة الدخول - أنوبي</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary-gold: #d4af37;
      --light-gold: #ffd700;
      --dark-blue: #020b24;
      --glass-dark: rgba(2, 11, 36, 0.85);
      --neon-glow: 0 0 25px rgba(255, 215, 0, 0.25);
      --error-color: #ff5252;
    }

    body {
      margin: 0;
      font-family: 'Cairo', sans-serif;
      /* تم دمج صورة back0.jpg مع طبقة تظليل لضمان وضوح النصوص */
      background: linear-gradient(rgba(2, 11, 36, 0.75), rgba(2, 11, 36, 0.9)), url('back0.jpg') center center / cover no-repeat fixed;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
      transition: opacity 0.8s ease-in-out;
    }

    .fade-out { opacity: 0; }

    /* مصفوفة الرموز الفرعونية */
    .hieroglyph-bg {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 1; overflow: hidden;
    }
    .glyph {
      position: absolute; color: rgba(255, 215, 0, 0.15); /* تم زيادة وضوح الرموز قليلاً لتناسب الخلفية الجديدة */
      font-size: clamp(35px, 5vw, 70px); user-select: none;
      animation: floatGlyph 25s infinite ease-in-out alternate;
    }
    .glyph:nth-child(1) { left: 10%; top: 15%; animation-duration: 18s; }
    .glyph:nth-child(2) { left: 85%; top: 20%; animation-duration: 22s; animation-delay: 2s; }
    .glyph:nth-child(3) { left: 15%; top: 75%; animation-duration: 26s; }
    .glyph:nth-child(4) { left: 80%; top: 70%; animation-duration: 20s; animation-delay: 4s; }

    @keyframes floatGlyph {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(-50px) rotate(360deg); color: rgba(255, 215, 0, 0.25); }
    }

    /* صندوق الدخول */
    .login-container {
      background: var(--glass-dark);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      padding: 40px 35px;
      border-radius: 28px;
      border: 1px solid rgba(212, 175, 55, 0.3);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8), var(--neon-glow);
      width: 90%;
      max-width: 440px;
      text-align: center;
      animation: containerSpawn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      z-index: 10;
      transition: all 0.5s ease;
    }

    @keyframes containerSpawn {
      from { opacity: 0; transform: translateY(30px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .shake { animation: shakeError 0.4s ease-in-out; }
    @keyframes shakeError {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }

    /* تعديلات أيقونة أنوبي لتتناسب مع الإطار */
    .logo-wrapper {
      background: radial-gradient(circle, rgba(212, 175, 55, 0.25) 0%, rgba(0,0,0,0.5) 80%);
      border: 3px solid var(--primary-gold);
      border-radius: 50%;
      width: 110px; height: 110px;
      margin: 0 auto 25px auto;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 20px rgba(0,0,0,0.4); cursor: pointer; transition: 0.4s ease;
      overflow: hidden; /* إخفاء أي حواف زائدة من الصورة */
      padding: 8px; /* مساحة تنفس للصورة داخل الدائرة */
      box-sizing: border-box;
    }
    .logo-wrapper:hover { transform: scale(1.08) rotate(15deg); border-color: var(--light-gold); box-shadow: 0 0 30px var(--light-gold); }
    
    .logo { 
      width: 120%; 
      height: 120%; 
      object-fit: contain; /* ضمان ظهور الصورة كاملة دون قص */
      filter: drop-shadow(0 0 5px rgba(255, 215, 0, 0.5));
    }

    h2 {
      margin-bottom: 25px;
      background: linear-gradient(to right, #d4af37 20%, #ffd700 40%, #ffd700 60%, #d4af37 80%);
      background-size: 200% auto; color: transparent;
      -webkit-background-clip: text; background-clip: text; animation: shineGold 4s linear infinite;
      font-weight: 900; font-size: 26px;
    }
    @keyframes shineGold { to { background-position: 200% center; } }

    .input-group { display: flex; gap: 12px; margin-bottom: 5px; }
    
    input {
      width: 100%; padding: 14px 18px; margin: 10px 0; font-size: 16px;
      background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 12px; color: white; font-family: 'Cairo', sans-serif;
      transition: all 0.3s ease; box-sizing: border-box;
    }
    input:focus { border-color: var(--light-gold); background: rgba(255, 255, 255, 0.1); box-shadow: 0 0 15px rgba(255, 215, 0, 0.3); outline: none; }
    input.input-error { border-color: var(--error-color); box-shadow: 0 0 10px rgba(255, 82, 82, 0.4); }

    .gender-selector { display: flex; gap: 15px; margin: 15px 0; }
    .gender-option {
      flex: 1; padding: 12px; border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px; background: rgba(255, 255, 255, 0.03); cursor: pointer;
      color: rgba(255, 255, 255, 0.6); font-weight: bold; font-size: 16px;
      transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .gender-option.selected[data-gender="male"] { background: rgba(0, 140, 255, 0.15); border-color: #008cff; color: #00c3ff; box-shadow: 0 0 15px rgba(0, 140, 255, 0.3); }
    .gender-option.selected[data-gender="female"] { background: rgba(255, 0, 128, 0.15); border-color: #ff0080; color: #ff55aa; box-shadow: 0 0 15px rgba(255, 0, 128, 0.3); }

    button {
      width: 100%; padding: 16px; background: linear-gradient(135deg, #b8860b, var(--primary-gold));
      color: #020b24; font-weight: 900; font-size: 17px; border: none;
      border-radius: 14px; cursor: pointer; margin-top: 15px; transition: all 0.4s ease;
      display: flex; justify-content: center; align-items: center; gap: 10px;
    }
    button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 25px var(--light-gold); background: linear-gradient(135deg, #fff, var(--light-gold)); }
    button:disabled { opacity: 0.7; cursor: not-allowed; }

    .spinner {
      display: none; width: 20px; height: 20px;
      border: 3px solid rgba(2, 11, 36, 0.3); border-top: 3px solid #020b24;
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    button.loading .spinner { display: block; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .error { color: var(--error-color); font-size: 14px; margin-top: 12px; font-weight: bold; min-height: 20px; }
  </style>
</head>
<body>

  <div class="hieroglyph-bg">
    <div class="glyph">𓂀</div><div class="glyph">☥</div><div class="glyph">𓆣</div><div class="glyph">𓋹</div>
  </div>

  <div class="login-container" id="loginCard">
    <div class="logo-wrapper" onclick="UIController.speakGreeting()">
      <img src="anobi.png" class="logo" alt="رمز أنوبي" onerror="this.style.display='none'; this.parentElement.innerHTML='🤖';" />
    </div>

    <h2>بوابة الزمن - تسجيل الدخول</h2>

    <div class="input-group">
      <input type="text" id="firstName" placeholder="الاسم الأول" autocomplete="off" />
      <input type="text" id="lastName" placeholder="اسم العائلة" autocomplete="off" />
    </div>
    <input type="password" id="password" placeholder="مفتاح العبور (6 رموز+)" />
    
    <!-- الألقاب الجديدة -->
    <div class="gender-selector">
      <div class="gender-option selected" data-gender="male" onclick="UIController.selectGender('male')">🤴 فرعون</div>
      <div class="gender-option" data-gender="female" onclick="UIController.selectGender('female')">👸 ملكة</div>
    </div>

    <div class="error" id="errorMsg"></div>

    <button id="submitBtn" onclick="AppController.handleLogin()">
      <span class="btn-text">ولوج لبوابة المغامرة</span>
      <div class="spinner"></div>
    </button>
  </div>

  <audio id="gateSound" src="https://cdn.pixabay.com/download/audio/2023/03/26/audio_f5a8e6cb5a.mp3?filename=portal-113172.mp3" preload="auto"></audio>

  <script>
    class AnubiBackend {
      static async authenticateUser(userData) {
        return new Promise((resolve) => {
          setTimeout(() => {
            try {
              let db = JSON.parse(localStorage.getItem("explorers_db")) || [];
              const fullUsername = `${userData.firstName} ${userData.lastName}`.trim().toLowerCase();
              
              let existingUser = db.find(u => u.username.toLowerCase() === fullUsername);

              if (existingUser) {
                if (existingUser.password !== userData.password) {
                  return resolve({ success: false, message: "مفتاح العبور غير متطابق مع البيانات المسجلة." });
                }
                existingUser.gender = userData.gender; 
                existingUser.lastLogin = new Date().toISOString();
                this._saveSession(existingUser);
                this._updateDB(db);
                return resolve({ success: true, user: existingUser, isNew: false });
              } else {
                const newUser = {
                  id: 'EXP-' + Math.random().toString(36).substr(2, 9).toUpperCase(),
                  username: fullUsername,
                  originalName: `${userData.firstName} ${userData.lastName}`,
                  password: userData.password,
                  gender: userData.gender,
                  points: 0,
                  joinedAt: new Date().toISOString()
                };
                db.push(newUser);
                this._saveSession(newUser);
                this._updateDB(db);
                return resolve({ success: true, user: newUser, isNew: true });
              }
            } catch (error) {
              resolve({ success: false, message: "حدث خطأ في قاعدة البيانات المركزية." });
            }
          }, 1200);
        });
      }

      static _saveSession(user) {
        localStorage.setItem("active_session", JSON.stringify(user));
      }

      static _updateDB(db) {
        localStorage.setItem("explorers_db", JSON.stringify(db));
      }
    }

    class UIController {
      static currentGender = "male";

      static selectGender(gender) {
        this.currentGender = gender;
        document.querySelectorAll('.gender-option').forEach(opt => opt.classList.remove('selected'));
        document.querySelector(`.gender-option[data-gender="${gender}"]`).classList.add('selected');
        
        const container = document.getElementById("loginCard");
        if(gender === "female") {
          container.style.boxShadow = "0 25px 50px rgba(0, 0, 0, 0.8), 0 0 25px rgba(255, 0, 128, 0.25)";
          container.style.borderColor = "rgba(255, 0, 128, 0.3)";
        } else {
          container.style.boxShadow = "0 25px 50px rgba(0, 0, 0, 0.8), var(--neon-glow)";
          container.style.borderColor = "rgba(212, 175, 55, 0.3)";
        }
      }

      static setLoading(isLoading) {
        const btn = document.getElementById("submitBtn");
        if(isLoading) {
          btn.classList.add("loading");
          btn.disabled = true;
          btn.querySelector(".btn-text").textContent = "جارٍ التحقق من الشفرة...";
        } else {
          btn.classList.remove("loading");
          btn.disabled = false;
          btn.querySelector(".btn-text").textContent = "ولوج لبوابة المغامرة";
        }
      }

      static showError(message, inputIds = []) {
        const errorEl = document.getElementById("errorMsg");
        const card = document.getElementById("loginCard");
        
        errorEl.textContent = message;
        card.classList.remove("shake");
        void card.offsetWidth; 
        card.classList.add("shake");

        document.querySelectorAll('input').forEach(inp => inp.classList.remove('input-error'));
        inputIds.forEach(id => document.getElementById(id).classList.add('input-error'));
      }

      static speakGreeting() {
        speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance("مَرْحَبًا بك عند بوابة الزمن. أنا أنوبي، بانتظاركَ لنبدأ رحلة استكشافيةً عبر حضارة مصر العريقة ");
        msg.lang = "ar-EG";
        speechSynthesis.speak(msg);
      }

      static playSuccessFX(firstName) {
        try {
          const gateSound = document.getElementById("gateSound");
          gateSound.playbackRate = 1.3;
          gateSound.play().catch(e => console.log("الصوت يتطلب تفاعل المستخدم المسبق"));
        } catch (e) {}

        speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(`الولوج مصرح. أهلاً بك يا ${firstName}.`);
        msg.lang = "ar-EG";
        speechSynthesis.speak(msg);
      }
    }

    class AppController {
      static async handleLogin() {
        const firstName = document.getElementById("firstName").value.trim();
        const lastName = document.getElementById("lastName").value.trim();
        const password = document.getElementById("password").value;

        if (!firstName || !lastName) {
          return UIController.showError("يجب إدخال الاسم الثنائي بالكامل.", ["firstName", "lastName"]);
        }
        if (password.length < 6) {
          return UIController.showError("مفتاح العبور ضعيف، يجب أن يتكون من 6 رموز على الأقل.", ["password"]);
        }

        document.getElementById("errorMsg").textContent = "";
        document.querySelectorAll('input').forEach(inp => inp.classList.remove('input-error'));

        UIController.setLoading(true);

        const response = await AnubiBackend.authenticateUser({
          firstName,
          lastName,
          password,
          gender: UIController.currentGender
        });

        UIController.setLoading(false);

        if (!response.success) {
          UIController.showError(response.message, ["password"]);
        } else {
          UIController.playSuccessFX(firstName);
          document.body.classList.add("fade-out");
          
          setTimeout(() => {
            window.location.href = "home.html";
          }, 1800);
        }
      }
    }

    // ==========================================
    // 4. نظام تذكر المستخدم (Remember Me)
    // ==========================================
    document.addEventListener("DOMContentLoaded", () => {
      const savedSession = localStorage.getItem("active_session");
      if (savedSession) {
        try {
          const user = JSON.parse(savedSession);
          // استخراج الاسم الأول والأخير من الاسم الكامل
          if (user.originalName) {
            const nameParts = user.originalName.split(" ");
            document.getElementById("firstName").value = nameParts[0] || "";
            document.getElementById("lastName").value = nameParts.slice(1).join(" ") || "";
          }
          
          // استرجاع كلمة المرور واللقب (الجنس)
          document.getElementById("password").value = user.password || "";
          if (user.gender) {
            UIController.selectGender(user.gender);
          }
        } catch (e) {
          console.error("خطأ في قراءة بيانات الجلسة السابقة", e);
        }
      }
    });

    document.addEventListener('keydown', (e) => {
      if(e.key === 'Enter') AppController.handleLogin();
    });
  </script>
</body>
</html>
